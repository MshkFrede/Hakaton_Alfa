# Полный стенд: docker compose up --build
# Интерфейс: http://localhost:8080   Swagger UI: http://localhost:8081
# Если порты заняты — задайте API_PORT / SWAGGER_PORT / MOCKS_PORT / DB_PORT в .env
name: credit-conveyor

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: credit
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit -d credit"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mocks:
    build:
      context: .
      target: mocks
    environment:
      HTTP_ADDR: ":8090"
      MOCK_LATENCY: ${MOCK_LATENCY:-400ms}
      MOCK_HANG: 15s
    ports:
      - "${MOCKS_PORT:-8090}:8090"
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://credit:${POSTGRES_PASSWORD:-credit}@postgres:5432/credit?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
      MOCKS_BASE_URL: http://mocks:8090
      PROCESSING_STEP_DELAY: ${PROCESSING_STEP_DELAY:-2s}
      INTEGRATION_TIMEOUT: 3s
      INTEGRATION_RETRIES: "2"
      WORKER_CONCURRENCY: "4"
      SEED_DEMO_DATA: "true"
      CORS_ORIGINS: http://localhost:${SWAGGER_PORT:-8081}
      LOG_LEVEL: info
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mocks:
        condition: service_healthy
    restart: unless-stopped

  swagger:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      URL: http://localhost:${API_PORT:-8080}/api/v1/openapi.yaml
    ports:
      - "${SWAGGER_PORT:-8081}:8080"
    depends_on:
      - api

volumes:
  pgdata:
